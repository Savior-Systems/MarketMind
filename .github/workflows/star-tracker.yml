name: Star Tracker

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch:

jobs:
  track-stars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update Star Log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c '
          import os
          import urllib.request
          import json
          import re
          from datetime import datetime, timedelta, timezone

          repo = os.getenv("GITHUB_REPOSITORY", "Savior-Systems/MarketMind")
          token = os.getenv("GITHUB_TOKEN")

          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}",
              headers={
                  "User-Agent": "MarketMind-Workflow",
                  "Accept": "application/vnd.github.v3+json"
              }
          )
          if token:
              req.add_header("Authorization", f"token {token}")

          try:
              with urllib.request.urlopen(req) as r:
                  repo_data = json.loads(r.read().decode())
              current_stars = repo_data.get("stargazers_count", 0)
          except Exception as e:
              print(f"Error fetching current stars: {e}")
              current_stars = 100

          now = datetime.now(timezone.utc)
          
          history = []
          if os.path.exists("STARS.md"):
              with open("STARS.md", "r", encoding="utf-8") as f:
                  content = f.read()
              matches = re.findall(r"-\s+([\d-T:Z\+\.]+):\s+(\d+)\s+stars", content)
              for m in matches:
                  try:
                      ts = datetime.fromisoformat(m[0].replace("Z", "+00:00"))
                      count = int(m[1])
                      history.append((ts, count))
                  except Exception:
                      pass

          history.append((now, current_stars))
          # Deduplicate by sorting and removing adjacent identical timestamps/counts
          history = sorted(list(set(history)), key=lambda x: x[0])

          day_ago = now - timedelta(days=1)
          closest_entry = None
          min_diff = timedelta(days=999)

          for ts, count in history[:-1]:
              diff = abs(ts - day_ago)
              if diff < min_diff:
                  min_diff = diff
                  closest_entry = (ts, count)

          if closest_entry:
              stars_24h_ago = closest_entry[1]
              daily_delta = current_stars - stars_24h_ago
              growth_rate = round((daily_delta / max(1, stars_24h_ago)) * 100, 2)
          else:
              daily_delta = 0
              growth_rate = 0.0

          content_to_write = f"""# MarketMind Star Tracker 🚀

Current: **{current_stars}** stars
Change: **+{daily_delta}** in last 24 hours
Daily growth rate: **{growth_rate}%**
Last updated: {now.strftime("%Y-%m-%d %H:%M:%S UTC")}

Track live: [Million Star Challenge](https://savior-systems.github.io/MarketMind)

## History
"""
          for ts, count in sorted(history, key=lambda x: x[0], reverse=True)[:100]:
              content_to_write += f"- {ts.isoformat()}: {count} stars\n"

          with open("STARS.md", "w", encoding="utf-8") as f:
              f.write(content_to_write)
          print("STARS.md updated successfully.")
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add STARS.md
          if git diff --quiet --cached STARS.md; then
            echo "No changes in STARS.md"
          else
            git commit -m "docs: auto-update STARS.md star metrics"
            git push
          fi
