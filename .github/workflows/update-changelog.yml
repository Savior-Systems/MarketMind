name: Update Changelog

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR Labels
        id: check-pr
        run: |
          PR_NUMBER=$(git log -1 --pretty=%B | grep -oE '#[0-9]+' | head -n 1 | sed 's/#//')
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR found in commit message. Skipping."
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          LABELS=$(curl -s "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}" | jq -r '.labels[].name')
          
          if echo "$LABELS" | grep -qE 'release|changelog'; then
            echo "Found matching label in PR #${PR_NUMBER}"
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT
          else
            echo "No matching labels (release or changelog) found. Skipping."
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CHANGELOG.md
        if: steps.check-pr.outputs.should_run == 'true'
        run: |
          PR_TITLE=$(curl -s "https://api.github.com/repos/${{ github.repository }}/pulls/${{ steps.check-pr.outputs.pr_number }}" | jq -r '.title')
          PR_BODY=$(curl -s "https://api.github.com/repos/${{ github.repository }}/pulls/${{ steps.check-pr.outputs.pr_number }}" | jq -r '.body')
          DATE=$(date +%Y-%m-%d)
          
          ENTRY="### Added\n- ${PR_TITLE}\n\n${PR_BODY}"
          
          sed -i "/# Changelog/a \\\n## [PR #${{ steps.check-pr.outputs.pr_number }}] - ${DATE}\n${ENTRY}" CHANGELOG.md
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(changelog): auto-update for PR #${{ steps.check-pr.outputs.pr_number }}"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
