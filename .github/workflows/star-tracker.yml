name: Star Tracker

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-stars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch Star Count
        run: |
          STAR_COUNT=$(curl -s "https://api.github.com/repos/${{ github.repository }}" | jq -r '.stargazers_count')
          if [ "$STAR_COUNT" = "null" ] || [ -z "$STAR_COUNT" ]; then
            echo "Failed to fetch star count. Exiting."
            exit 1
          fi
          
          DATE=$(date +%Y-%m-%d)
          
          if [ ! -f STARS.md ]; then
            echo "# Star Tracking History" > STARS.md
            echo "| Date | Stars |" >> STARS.md
            echo "|------|-------|" >> STARS.md
          fi
          
          echo "| ${DATE} | ${STAR_COUNT} |" >> STARS.md
          
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add STARS.md
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(stars): track stargazers count history"
            git push origin main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
