name: Update Changelog

on:
  push:
    branches: [ main ]

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Fetch history to read commit message

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update CHANGELOG.md
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"
          python -c '
          import os
          import sys
          import re

          commit_msg = os.environ.get("COMMIT_MSG", "")
          # Match feat: or fix: (possibly with scope like feat(auth):)
          match = re.search(r"^(feat|fix)(?:\([^)]+\))?:\s*(.+)$", commit_msg, re.IGNORECASE | re.MULTILINE)
          if not match:
              print("Not a feat: or fix: commit. Skipping.")
              sys.exit(0)

          change_type = match.group(1).lower()
          desc = match.group(2).strip()

          with open("CHANGELOG.md", "r", encoding="utf-8") as f:
              lines = f.readlines()

          unreleased_index = -1
          first_version_index = -1
          for idx, line in enumerate(lines):
              if "## [Unreleased]" in line:
                  unreleased_index = idx
              elif re.match(r"^## \[\d+\.\d+\.\d+\]", line) and first_version_index == -1:
                  first_version_index = idx

          if unreleased_index == -1 and first_version_index == -1:
              for idx, line in enumerate(lines):
                  if line.startswith("## ") and first_version_index == -1:
                      first_version_index = idx

          if unreleased_index == -1:
              insert_pos = first_version_index if first_version_index != -1 else 8
              lines.insert(insert_pos, "## [Unreleased]\n### Added\n### Fixed\n\n")
              for idx, line in enumerate(lines):
                  if "## [Unreleased]" in line:
                      unreleased_index = idx
                      break

          target_section = "### Added" if change_type == "feat" else "### Fixed"
          section_index = -1
          for idx in range(unreleased_index + 1, len(lines)):
              if lines[idx].startswith("## "):
                  break
              if lines[idx].strip() == target_section:
                  section_index = idx
                  break

          if section_index == -1:
              lines.insert(unreleased_index + 1, f"{target_section}\n")
              section_index = unreleased_index + 1

          bullet = f"- {desc}\n"
          lines.insert(section_index + 1, bullet)

          with open("CHANGELOG.md", "w", encoding="utf-8") as f:
              f.writelines(lines)

          print(f"Added descriptor to {target_section}")
          '
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}

      - name: Commit and Push Changes
        run: |
          if git diff --quiet --cached CHANGELOG.md; then
            echo "No changes in CHANGELOG.md"
          else
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: auto-update CHANGELOG.md"
            git pull --rebase origin main || true
            git push
          fi
