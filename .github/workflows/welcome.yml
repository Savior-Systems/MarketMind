name: Welcome First Interaction

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Welcome first-time contributor
        uses: actions/first-interaction@v1.1.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Thanks for opening your first issue/PR at MarketMind! We appreciate your contribution. Check out our [Contributing Guide](CONTRIBUTING.md) and join our [Discord](https://discord.gg/marketmind)!
          pr-message: |
            👋 Thanks for opening your first issue/PR at MarketMind! We appreciate your contribution. Check out our [Contributing Guide](CONTRIBUTING.md) and join our [Discord](https://discord.gg/marketmind)!
