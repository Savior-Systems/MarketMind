services:
  - type: web
    name: marketmind-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketmind-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: marketmind-redis
          type: redis
          property: connectionString

  - type: web
    name: marketmind-frontend
    env: node
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://marketmind-backend.onrender.com/api/v1

databases:
  - name: marketmind-db
    databaseName: marketmind
    user: marketmind

  - name: marketmind-redis
    ipAllowList: []
