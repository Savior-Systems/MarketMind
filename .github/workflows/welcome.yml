name: Welcome first-time contributors

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome Issue
        if: github.event.issue && github.event.issue.user.type != 'Bot'
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Welcome to MarketMind! Thank you for opening your first issue. Built by one, owned by everyone. Let's make self-hosting great!"
          pr-message: "Welcome to MarketMind! Thank you for opening your first Pull Request. Our maintainers will review it shortly. Respect is non-negotiable."
