name: Mark Stale Issues

on:
  schedule:
    - cron: '30 1 * * *' # Daily at 01:30 UTC
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Mark and Close Stale Issues
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 14
          days-before-issue-close: 16 # 14 + 16 = 30 days total inactivity before close
          stale-issue-label: 'stale'
          exempt-issue-labels: 'priority:critical,good-first-issue,roadmap,imperfection'
          stale-issue-message: 'This issue has been automatically marked as stale because it has not had recent activity. It will be closed in 16 days if no further activity occurs. Thank you for your contributions!'
          close-issue-message: 'This issue has been automatically closed because it has not had recent activity.'
          # Ignore PRs for stale marking unless wanted, or set PR days high
          days-before-pr-stale: -1
          days-before-pr-close: -1
