name: MarketMind CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          # Ensure test tools are installed
          pip install ruff mypy pytest pytest-cov

      - name: Run Ruff Linter
        run: ruff check backend/

      - name: Run Mypy Type Checks
        run: mypy backend/ || true # Allow failures initially as requested

      - name: Run Pytest
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "testsecretkeyvaluefortestingonly"
        run: |
          cd backend
          python -m pytest tests/ -v

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Compilation Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run Next.js Linter
        run: |
          cd frontend
          npx next lint

      - name: Run Next.js Build
        run: |
          cd frontend
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build -t marketmind-backend:test ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t marketmind-frontend:test ./frontend

      - name: Verify Docker Compose Config
        run: |
          docker compose config --quiet
