version: '3.8'

# ==============================================================================
# MarketMind Local Development Infrastructure Compose (Clean)
# ==============================================================================
# Starts core databases and cache instances for local testing.
# ==============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: marketmind-dev-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketmind
    ports:
      - "5432:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    networks:
      - dev-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: marketmind-dev-redis
    ports:
      - "6379:6379"
    volumes:
      - dev_redis_data:/data
    networks:
      - dev-network
    restart: unless-stopped

volumes:
  dev_postgres_data:
  dev_redis_data:

networks:
  dev-network:
    name: marketmind-dev-network
